apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-wp-pv-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.wordpress.storageSize | default "2Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
spec:
  replicas: {{ .Values.wordpress.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-wordpress
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-wordpress
    spec:
      containers:
      - image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
        name: wordpress
        env:
        - name: WORDPRESS_DB_HOST
          value: "{{ .Release.Name }}-mysql-service:3306"
        - name: WORDPRESS_DB_USER
          value: {{ .Values.dbSecret.user | quote }}
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mysql-pass
              key: mysql-password
        - name: WORDPRESS_DB_NAME
          value: {{ .Values.dbSecret.database | quote }}
        ports:
        - containerPort: 80
          name: wordpress
        volumeMounts:
        - name: wordpress-persistent-storage
          mountPath: /var/www/html
        # ... env and volumeMounts ...
        resources:
          {{- toYaml .Values.wordpress.resources | nindent 10 }}
        # Liveness Probe: Restarts container if PHP crashes completely
        livenessProbe:
          httpGet:
            path: /wp-login.php
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        # Readiness Probe: Stops routing traffic if WordPress is busy/overloaded
        readinessProbe:
          httpGet:
            path: /wp-login.php
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: wordpress-persistent-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-wp-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wordpress-service
spec:
  type: {{ .Values.wordpress.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.wordpress.service.port | default 80 }}
    targetPort: 80
    {{- if eq .Values.wordpress.service.type "NodePort" }}
    nodePort: {{ .Values.wordpress.service.nodePort | default 30080 }}
    {{- end }}
  selector:
    app: {{ .Release.Name }}-wordpress
